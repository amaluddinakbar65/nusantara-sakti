<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nusantara HRIS by Amaluddin Akbar</title>
<style>
:root{--bg:#f4f6fb;--sf:rgba(255,255,255,.8);--so:#fff;--tx:#1b2238;--mu:#6b7490;--bd:#e3e7f1;--pr:#3d5afe;--pr2:#e8ecff;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--sh:0 2px 10px rgba(30,40,90,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1220;--sf:rgba(24,28,48,.8);--so:#181c30;--tx:#e8ebf7;--mu:#9aa3c2;--bd:#2a3050;--pr:#7c93ff;--pr2:#252c55;--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1220;--sf:rgba(24,28,48,.8);--so:#181c30;--tx:#e8ebf7;--mu:#9aa3c2;--bd:#2a3050;--pr:#7c93ff;--pr2:#252c55;--sh:none;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:215px;background:var(--sf);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:800;font-size:18px;color:var(--pr);padding:4px 10px 16px}.logo small{display:block;font-weight:500;color:var(--mu);font-size:11px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:10px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;margin-bottom:3px}
nav button.on,nav button:hover{background:var(--pr2);color:var(--pr)}
main{flex:1;padding:24px;min-width:0;max-width:1100px}
h1{margin:0 0 4px;font-size:22px}.sub{color:var(--mu);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.st b{display:block;font-size:24px}.st span{color:var(--mu);font-size:12px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.bar i{display:block;height:10px;border-radius:6px;background:var(--pr)}.bar span:first-child{width:130px;color:var(--mu)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--sf);color:var(--tx);max-width:100%}
.btn{background:var(--pr);color:#fff;border:0;padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:var(--pr2);color:var(--pr)}.btn.s{padding:4px 9px;font-size:12px}.btn.r{background:#fee2e2;color:var(--er)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
.tag{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--pr2);color:var(--pr)}
.tag.ok{background:#dcfce7;color:var(--ok)}.tag.wa{background:#fef3c7;color:var(--wa)}.tag.er{background:#fee2e2;color:var(--er)}
.mo{position:fixed;inset:0;background:rgba(10,15,40,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.mo.on{display:flex}
.md{background:var(--so);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.md label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}.md input,.md select{width:100%}
.note{font-size:12px;color:var(--mu);margin-top:10px}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.kan h4{margin:0 0 8px;font-size:13px}.kan .card{padding:10px;margin-bottom:8px}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;gap:4px;padding:8px}nav .logo{display:none}nav button{width:auto;white-space:nowrap;margin:0}main{padding:14px}}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--bd) 1.2px,transparent 1.2px);background-size:24px 24px;opacity:.7}
.bgfx b{position:absolute;border-radius:50%;filter:blur(80px);opacity:.42;animation:fl 18s ease-in-out infinite alternate}
.bgfx b:nth-child(1){width:440px;height:440px;background:#3d5afe;top:-120px;left:-100px}
.bgfx b:nth-child(2){width:400px;height:400px;background:#e11d48;right:-120px;top:22%;animation-delay:-6s}
.bgfx b:nth-child(3){width:380px;height:380px;background:#f59e0b;bottom:-140px;left:38%;animation-delay:-11s}
@keyframes fl{to{transform:translate(70px,50px) scale(1.18)}}
nav,.card,table{backdrop-filter:blur(10px)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;background:linear-gradient(120deg,#2740e0,#6d28d9 60%,#be123c);color:#fff;border-radius:20px;padding:20px 26px;margin-bottom:18px;overflow:hidden;box-shadow:0 10px 30px rgba(61,90,254,.3)}
.hart{width:310px;flex-shrink:0}
.foot{display:flex;gap:12px;align-items:center;margin-top:28px;padding:16px 4px;border-top:1px solid var(--bd);color:var(--mu);font-size:12px;flex-wrap:wrap}.foot b{color:var(--tx)}.foot .btn{margin-left:auto}
.scr{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:28px;overflow:auto;color:#fff;background:linear-gradient(125deg,#12134d,#2740e0,#6d28d9,#be123c);background-size:300% 300%;animation:gs 16s ease infinite}
#bye{background:linear-gradient(125deg,#3b0a1e,#9f1239,#6d28d9,#12134d);background-size:300% 300%}
@keyframes gs{50%{background-position:100% 50%}}
.scr .o{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:fl 14s ease-in-out infinite alternate;pointer-events:none}
.o1{width:300px;height:300px;top:-80px;left:-60px}.o2{width:220px;height:220px;bottom:-40px;right:12%;animation-delay:-5s}.o3{width:140px;height:140px;top:18%;right:6%;animation-delay:-9s}
.wm{position:absolute;right:-120px;top:50%;transform:translateY(-50%);opacity:.07;pointer-events:none}
.cv{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:36px;max-width:1080px;width:100%;align-items:center}
.cv>*{animation:up .9s both}.cv>*:nth-child(2){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.brand{display:flex;gap:14px;align-items:center;margin-bottom:18px}.eb{font-weight:700;letter-spacing:.04em}.eb2{font-size:12px;opacity:.75;margin-top:2px}
.big{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:0;font-weight:800}.by{font-size:18px;font-weight:700;color:#ffd666;margin:6px 0 14px}
.lead{max-width:520px;opacity:.92;font-size:15px;line-height:1.65}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}.chips span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
.btn.cta{background:#ffd666;color:#3b1d00;padding:12px 24px;font-size:15px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.28)}.btn.cta.g2{background:rgba(255,255,255,.16);color:#fff}
.glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(10px);border-radius:24px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
@media(max-width:760px){.hart{display:none}.cv{grid-template-columns:1fr}.cv .glass{order:-1}.foot .btn{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#auth{z-index:70;background:linear-gradient(125deg,#0f172a,#1e3a8a,#6d28d9,#9f1239);background-size:300% 300%}
.af label{display:block;font-size:12px;opacity:.85;text-align:left}
.af input{width:100%;margin:3px 0 11px;border:0;padding:10px 12px;background:rgba(255,255,255,.96);color:#111}
.amsg{background:rgba(255,255,255,.18);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
.mail{background:#fff;color:#111;border-radius:12px;padding:10px 12px;text-align:left;margin:8px 0 12px;font-size:13px}
.usr{font-size:12px;color:var(--mu);padding:12px 12px 4px}
</style>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script></head><body>
<div class="bgfx"><b></b><b></b><b></b></div>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div class="scr" id="cover"></div><div class="scr" id="bye" style="display:none"></div><div class="scr" id="auth" style="display:none"></div>
<div class="mo" id="mo"><div class="md" id="md"></div></div>
<script>
const G=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" role="img" aria-label="Logo Garuda Nusantara"><circle cx="50" cy="50" r="47" fill="#9f1239"/><circle cx="50" cy="50" r="43" fill="none" stroke="#f5b50a" stroke-width="2"/><g fill="#f5b50a"><circle cx="50" cy="31" r="5.5"/><path d="M54 29l8 4-8 3z"/><path d="M50 38c-5 2-7 9-7 15l3 14h8l3-14c0-6-2-13-7-15z"/><path d="M44 43C34 37 22 37 11 44c8 0 12 3 14 6-6-1-11 1-15 5 6 0 10 2 13 6-4 0-8 2-10 6 8-2 14-1 20 2z"/><path transform="translate(100 0) scale(-1 1)" d="M44 43C34 37 22 37 11 44c8 0 12 3 14 6-6-1-11 1-15 5 6 0 10 2 13 6-4 0-8 2-10 6 8-2 14-1 20 2z"/><path d="M45 70l-6 14 11-6 11 6-6-14z"/></g></svg>`;
const PER=(x,y,c)=>`<g transform="translate(${x} ${y})"><rect x="-13" y="13" width="26" height="32" rx="10" fill="${c}"/><circle r="11" fill="#f1c9a5"/><path d="M-11-1C-9-14 9-14 11-1c-6-4-16-4-22 0z" fill="#2b2118"/></g>`;
const DESK=(x,y)=>`<rect x="${x}" y="${y}" width="86" height="8" rx="3" fill="#8b5e34"/><rect x="${x+8}" y="${y+8}" width="5" height="32" fill="#6b4423"/><rect x="${x+73}" y="${y+8}" width="5" height="32" fill="#6b4423"/><rect x="${x+26}" y="${y-22}" width="34" height="22" rx="3" fill="#334155"/><rect x="${x+29}" y="${y-19}" width="28" height="16" rx="2" fill="#7dd3fc"/>`;
const ART=()=>{let w='',sk='';for(let r=0;r<8;r++)for(let c=0;c<5;c++)w+=`<rect x="${52+c*21}" y="${90+r*20}" width="13" height="12" rx="2" fill="${(r*3+c*5)%7<3?'#ffe08a':'#b9c8ff'}"/>`;
[[8,190,30],[176,170,24],[184,205,18]].forEach(([x,y,wd])=>{sk+=`<rect x="${x}" y="${y}" width="${wd}" height="${280-y}" fill="#a9bcf0"/>`});
return`<svg viewBox="0 0 540 320" style="width:100%;height:auto;display:block" role="img" aria-label="Ilustrasi gedung perusahaan dan karyawan yang sedang bekerja"><rect width="540" height="320" rx="18" fill="#d6e4ff"/><circle cx="490" cy="44" r="22" fill="#ffd666"/><ellipse cx="300" cy="40" rx="36" ry="11" fill="#fff" opacity=".85"/><ellipse cx="330" cy="34" rx="24" ry="9" fill="#fff" opacity=".85"/>${sk}
<rect x="0" y="280" width="540" height="40" fill="#8aa0c8"/><rect x="0" y="280" width="540" height="5" fill="#6f86b3"/>
<rect x="42" y="64" width="120" height="216" rx="4" fill="#3d5afe"/>${w}<rect x="86" y="250" width="32" height="30" rx="3" fill="#1e2a78"/><rect x="52" y="40" width="100" height="22" rx="5" fill="#fff"/><text x="102" y="56" text-anchor="middle" font-family="system-ui,Arial" font-weight="800" font-size="12" fill="#1e2a78">NUSANTARA</text>
<rect x="100" y="14" width="3" height="26" fill="#475569"/><rect x="103" y="14" width="26" height="8" fill="#dc2626"/><rect x="103" y="22" width="26" height="8" fill="#fff"/>
<rect x="196" y="96" width="326" height="184" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><rect x="196" y="268" width="326" height="12" fill="#cbd5e1"/>
<rect x="212" y="108" width="82" height="52" rx="4" fill="#fff" stroke="#cbd5e1"/><rect x="222" y="138" width="10" height="16" fill="#3d5afe"/><rect x="238" y="126" width="10" height="28" fill="#f59e0b"/><rect x="254" y="132" width="10" height="22" fill="#16a34a"/><rect x="270" y="116" width="10" height="38" fill="#be123c"/>
<rect x="318" y="108" width="70" height="52" rx="4" fill="#bfe3ff"/><line x1="353" y1="108" x2="353" y2="160" stroke="#fff" stroke-width="3"/><text x="458" y="126" text-anchor="middle" font-family="system-ui,Arial" font-weight="700" font-size="11" fill="#64748b">People &amp; Culture</text>
${PER(258,184,'#3d5afe')}${DESK(214,236)}${PER(372,184,'#be123c')}${DESK(328,236)}
<rect x="452" y="226" width="9" height="42" fill="#334155"/><rect x="468" y="226" width="9" height="42" fill="#334155"/>${PER(464,184,'#f59e0b')}<rect x="476" y="204" width="20" height="26" rx="2" fill="#fff" stroke="#94a3b8"/>
<rect x="500" y="246" width="12" height="22" rx="2" fill="#a16207"/><circle cx="506" cy="238" r="12" fill="#22a06b"/></svg>`};
const hero=()=>`<div class="hero"><div><div style="opacity:.85;font-size:12px">Selamat datang di</div><h2 style="margin:2px 0;font-size:26px">Nusantara HRIS</h2><div style="font-weight:700;color:#ffd666">by Amaluddin Akbar</div><p style="max-width:380px;opacity:.92;margin:8px 0 0">Kelola karyawan, absensi, cuti, penggajian, rekrutmen, dan screening CV dalam satu tempat.</p></div><div class="hart">${ART()}</div></div>`;
const foot=()=>`<footer class="foot">${G(36)}<div><b>Nusantara HRIS</b> by Amaluddin Akbar<br><span>© 2026 · Sistem informasi SDM untuk perusahaan swasta nasional · Data tersimpan di browser perangkat ini</span></div><button class="btn g s" onclick="showBye()">Penutup</button></footer>`;
function initScreens(){const ch=['Karyawan','Absensi','Cuti','Penggajian','Rekrutmen','Screening CV'].map(x=>`<span>${x}</span>`).join('');
$('cover').innerHTML=`<div class="o o1"></div><div class="o o2"></div><div class="o o3"></div><div class="wm">${G(560)}</div><div class="cv"><div>
<div class="brand">${G(64)}<div><div class="eb">${esc(S.co.nama)}</div><div class="eb2">Human Resource Information System</div></div></div>
<h1 class="big">Nusantara HRIS</h1><div class="by">by Amaluddin Akbar</div>
<p class="lead">Sistem informasi sumber daya manusia untuk perusahaan swasta nasional. Kelola data karyawan, kehadiran, cuti, gaji, rekrutmen, dan seleksi CV dengan mudah, rapi, dan transparan.</p>
<div class="chips">${ch}</div><button class="btn cta" onclick="enter()">Masuk ke Aplikasi →</button></div>
<div class="glass">${ART()}</div></div>`;
$('bye').innerHTML=`<div class="o o1"></div><div class="o o2"></div><div class="wm">${G(560)}</div><div class="cv" style="text-align:center;grid-template-columns:1fr;max-width:640px">${G(84).replace('<svg','<svg style="margin:0 auto"')}
<h1 class="big" style="font-size:40px">Terima kasih</h1><div class="by">Nusantara HRIS by Amaluddin Akbar</div><p class="lead" style="margin:0 auto">Semoga pengelolaan SDM perusahaan Anda semakin tertata, cepat, dan transparan. Data tersimpan di browser perangkat ini, jadi ekspor data penting secara berkala.</p>
<div class="glass" style="max-width:420px;margin:0 auto">${ART()}</div><div class="tools" style="justify-content:center"><button class="btn cta" onclick="hideScr('bye')">← Kembali ke Aplikasi</button><button class="btn cta g2" onclick="showCover()">Ke Halaman Cover</button></div><div class="eb2">© 2026 Nusantara HRIS · Amaluddin Akbar</div></div>`}
function hideScr(id){$(id).style.display='none';window.scrollTo(0,0)}
function showCover(){$('bye').style.display='none';$('cover').style.display='flex';$('cover').scrollTop=0}
function showBye(){$('cover').style.display='none';$('bye').style.display='flex';$('bye').scrollTop=0}
const K='nusantara-hris-v1',fmt=n=>'Rp '+Math.round(n).toLocaleString('id-ID'),today=()=>new Date().toISOString().slice(0,10);
const DEPT=['Operasional','Keuangan','HR & GA','Sales & Marketing','IT','Produksi'];
const demo=()=>({emp:[
{id:1,nik:'X-001',nama:'Budi Santoso',jab:'Manager Operasional',dept:'Operasional',join:'2019-03-01',gaji:15000000,tunj:3000000,ptkp:'K/2',status:'Tetap',sisa:12},
{id:2,nik:'X-002',nama:'Siti Rahmawati',jab:'HR Supervisor',dept:'HR & GA',join:'2020-07-15',gaji:11000000,tunj:2000000,ptkp:'TK/0',status:'Tetap',sisa:12},
{id:3,nik:'X-003',nama:'Agus Wijaya',jab:'Staf Akuntansi',dept:'Keuangan',join:'2022-01-10',gaji:7500000,tunj:1000000,ptkp:'K/1',status:'Tetap',sisa:10},
{id:4,nik:'X-004',nama:'Dewi Lestari',jab:'Sales Executive',dept:'Sales & Marketing',join:'2023-05-02',gaji:6500000,tunj:1500000,ptkp:'TK/0',status:'Kontrak',sisa:8},
{id:5,nik:'X-005',nama:'Rizky Pratama',jab:'IT Support',dept:'IT',join:'2024-02-19',gaji:7000000,tunj:500000,ptkp:'TK/0',status:'Kontrak',sisa:12},
{id:6,nik:'X-006',nama:'Yuni Handayani',jab:'Operator Produksi',dept:'Produksi',join:'2025-08-01',gaji:5200000,tunj:600000,ptkp:'K/0',status:'Probation',sisa:12}],
leave:[{id:1,emp:4,jenis:'Cuti Tahunan',mulai:'2026-11-10',hari:3,ket:'Acara keluarga',st:'Menunggu'}],
att:{},cand:[{id:1,nama:'Andi Firmansyah',posisi:'Staf Akuntansi',tahap:'Interview HR'},{id:2,nama:'Maya Putri',posisi:'Sales Executive',tahap:'Screening'},{id:3,nama:'Doni Kurniawan',posisi:'IT Support',tahap:'Penawaran'}],nid:50});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||demo();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),E=id=>S.emp.find(e=>e.id==id)||{nama:'(dihapus)'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view='dash',q='',attDate=today(),pm=today().slice(0,7);
const V={dash:'Dasbor',emp:'Karyawan',att:'Absensi',leave:'Cuti',pay:'Penggajian',rec:'Rekrutmen',scr:'Screening CV',set:'Pengaturan'};
function nav(){$('nav').innerHTML=`<div class="logo"><span style="display:flex;gap:8px;align-items:center">${G(34)}Nusantara HRIS</span><small>by Amaluddin Akbar</small><small>${esc(S.co.nama)}</small></div>`+Object.entries(V).map(([k,v])=>`<button class="${k==view?'on':''}" onclick="go('${k}')">${v}</button>`).join('')+(me.role=='Admin'?'<button onclick="reset()" style="margin-top:14px">↺ Reset data demo</button>':'')+'<button onclick="showCover()">⌂ Halaman cover</button><button onclick="showBye()">✦ Penutup</button><div class="usr">'+esc(me.nama)+' · '+me.role+'</div><button onclick="logout()">⎋ Keluar</button>'}
function ask(msg,fn,ok){$('md').oninput=null;$('md').innerHTML=`<h3 style="margin:0 0 8px">Konfirmasi</h3><p style="margin:0 0 16px">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" onclick="closeM()">Batal</button><button class="btn r" id="yes">${ok||'Hapus'}</button></div>`;$('mo').classList.add('on');$('yes').onclick=()=>{closeM();fn()}}
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;max-width:90%;white-space:pre-line;box-shadow:0 4px 16px rgba(0,0,0,.3)';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>{t.style.display='none'},4000)}
function go(v){view=v;q='';render()}
function reset(){ask('Kembalikan ke data demo? Semua perubahan akan hilang.',()=>{const co=S.co;S=demo();S.co=co;init();save();render()},'Reset')}

R.set=()=>{const adm=me.role=='Admin';return`<h1>Pengaturan</h1><p class="sub">Profil perusahaan, keamanan, dan akun pengguna HR.</p>
<div class="card" style="margin-bottom:12px"><b>Profil perusahaan</b><p style="margin:8px 0">Nama: <b>${esc(S.co.nama)}</b><br>Alamat: ${esc(S.co.alamat)}</p>${adm?'<button class="btn g s" onclick="editCo()">Ubah nama perusahaan</button>':'<span class="note">Hanya Admin yang dapat mengubah.</span>'}</div>
<div class="card" style="margin-bottom:12px"><b>Keamanan</b><p style="margin:8px 0">Masuk sebagai <b>${esc(me.nama)}</b> (${esc(me.email)}) · ${me.role}</p><div class="tools"><button class="btn g s" onclick="chPw()">Ganti kata sandi</button>${adm?`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${S.co.otp?'checked':''} onchange="S.co.otp=this.checked?1:0;save()">Wajib verifikasi kode email saat masuk (2 langkah)</label>`:''}</div></div>
${adm?`<div class="tools"><b>Pengguna HR</b><button class="btn s" onclick="addUser()">+ Tambah pengguna</button></div><div class="tw"><table><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Status</th><th></th></tr>${U.map(u=>`<tr><td><b>${esc(u.nama)}</b>${u==me?' <span class="tag ok">Anda</span>':''}</td><td>${esc(u.email)}</td><td><span class="tag">${u.role}</span></td><td>${u.must?'<span class="tag wa">Belum ganti sandi</span>':'<span class="tag ok">Aktif</span>'}</td><td><button class="btn g s" onclick="editUser(${u.id})">Ubah</button> <button class="btn g s" onclick="resetPw(${u.id})">Reset sandi</button>${u.role=='Admin'?(u==me?'':` <button class="btn g s" onclick="setRole(${u.id},'HR')">Jadikan HR</button>`):` <button class="btn g s" onclick="setRole(${u.id},'Admin')">Jadikan Admin</button> <button class="btn s" onclick="transferAdmin(${u.id})">Alihkan Admin ke akun ini</button>`} <button class="btn r s" onclick="delUser(${u.id})">Hapus</button></td></tr>`).join('')}</table></div>`:''}
<p class="note">Semua akun berperan Admin dapat menambah, mengubah, mereset, dan menghapus akun lain. Disarankan memiliki minimal dua Admin. Mode demo: akun dan kata sandi (disimpan dalam bentuk hash) berada di browser perangkat ini. Untuk penggunaan banyak pengguna lintas perangkat dan pengiriman email sungguhan, dibutuhkan server autentikasi.</p>`};
function setA(id,v){(S.att[attDate]=S.att[attDate]||{})[id]=v;save();render()}
function allH(){S.att[attDate]=Object.fromEntries(S.emp.map(e=>[e.id,'Hadir']));save();render()}
function addL(){if(!S.emp.length){toast('Tambahkan karyawan dulu.');return}modal('Ajukan Cuti',[['emp','Karyawan','sel',S.emp.map(e=>[e.id,e.nama])],['jenis','Jenis cuti','sel',['Cuti Tahunan','Cuti Sakit','Cuti Melahirkan','Cuti Penting']],['mulai','Tanggal mulai','date'],['hari','Jumlah hari','number'],['ket','Keterangan','text']],{jenis:'Cuti Tahunan',mulai:today(),hari:1,ket:'-'},o=>S.leave.push({...o,emp:+o.emp,id:S.nid++,st:'Menunggu'}))}
function decL(id,ok){const l=S.leave.find(x=>x.id==id),e=S.emp.find(x=>x.id==l.emp);if(ok&&l.jenis=='Cuti Tahunan'&&e){if(e.sisa<l.hari){toast('Sisa cuti tidak cukup.');return}e.sisa-=l.hari}l.st=ok?'Disetujui':'Ditolak';save();render()}
function delL(id){S.leave=S.leave.filter(l=>l.id!=id);save();render()}
function addC(){modal('Tambah Kandidat',[['nama','Nama','text'],['posisi','Posisi dilamar','text'],['tahap','Tahap','sel',TH]],{tahap:TH[0]},o=>S.cand.push({...o,id:S.nid++}))}
function movC(id,t){S.cand.find(c=>c.id==id).tahap=t;save();render()}
function delC(id){S.cand=S.cand.filter(c=>c.id!=id);save();render()}
initScreens();render();
</script></body></html>
